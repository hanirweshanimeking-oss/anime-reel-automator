name: Autonomous Anime Reel Publisher
on:
  pull_request:
    branches: [main]
  schedule:
    - cron: '30 6 * * *'
    - cron: '30 12 * * *'
  workflow_dispatch:
    inputs:
      mode:
        description: 'Content engine'
        required: true
        default: 'anime'
        type: choice
        options: [anime, psychology]
      theme:
        description: 'Source anime theme (also supplies visuals in psychology mode)'
        required: true
        default: 'random'
        type: choice
        options: [random, jjk_honored_one, jjk_malevolent_shrine, demon_slayer_flame, naruto_sasuke_rivals, one_piece_luffy_haki, aot_clash]
      voice_profile:
        description: 'Optional narration voice style'
        required: true
        default: 'off'
        type: choice
        options: [off, auto, ayanokoji-inspired, johan-inspired, deep-narrator, bright-narrator]
      dry_run:
        description: 'Render without publishing'
        required: true
        default: true
        type: boolean
concurrency:
  group: reel-publishing
  cancel-in-progress: false
permissions:
  contents: read
jobs:
  test:
    name: Unit tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Run unit tests
        run: python3 -m unittest discover -s tests -v
  render-and-publish:
    if: github.event_name != 'pull_request'
    needs: test
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: pip
      - name: Install FFmpeg and fonts
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq ffmpeg fonts-noto-cjk fonts-noto-extra
      - name: Install Python dependencies
        run: pip install --upgrade pip && pip install -r requirements.txt
      - name: Run content pipeline
        env:
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          UPLIKA_API_KEY: ${{ secrets.UPLIKA_API_KEY }}
          UPLIKA_ACCOUNT_ID: ${{ secrets.UPLIKA_ACCOUNT_ID }}
          GDRIVE_REFRESH_TOKEN: ${{ secrets.GDRIVE_REFRESH_TOKEN }}
          GDRIVE_CLIENT_ID: ${{ secrets.GDRIVE_CLIENT_ID }}
          GDRIVE_CLIENT_SECRET: ${{ secrets.GDRIVE_CLIENT_SECRET }}
          ELEVENLABS_API_KEY: ${{ secrets.ELEVENLABS_API_KEY }}
          VOICE_ID_AYANOKOJI_INSPIRED: ${{ secrets.VOICE_ID_AYANOKOJI_INSPIRED }}
          VOICE_ID_JOHAN_INSPIRED: ${{ secrets.VOICE_ID_JOHAN_INSPIRED }}
          VOICE_ID_DEEP_NARRATOR: ${{ secrets.VOICE_ID_DEEP_NARRATOR }}
          VOICE_ID_BRIGHT_NARRATOR: ${{ secrets.VOICE_ID_BRIGHT_NARRATOR }}
          CONTENT_MODE: ${{ inputs.mode || 'anime' }}
        run: |
          THEME='${{ inputs.theme || 'random' }}'
          MODE='${{ inputs.mode || 'anime' }}'
          VOICE_PROFILE='${{ inputs.voice_profile || 'off' }}'
          FLAGS=''
          if [ '${{ inputs.dry_run }}' = 'true' ] || [ '${{ github.event_name }}' = 'schedule' ]; then FLAGS='--dry-run'; fi
          python3 pipeline.py --mode "$MODE" --theme "$THEME" --voice-profile "$VOICE_PROFILE" $FLAGS
      - name: Upload rendered Reel artifact
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: generated-instagram-reel
          path: outputs/*.mp4
          if-no-files-found: ignore
          retention-days: 7
      - name: Upload run history and metrics template
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: reel-run-logs
          path: |
            publish_history.json
            analytics/instagram_metrics.csv
          if-no-files-found: ignore
          retention-days: 14
